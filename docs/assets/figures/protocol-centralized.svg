<polygon class="head-ok" points="272.7,194.0 264.7,189.6 264.7,198.4"/>
<text x="173.3" y="187.0" text-anchor="middle" class="t-soft halo">TASK_RECEIVED</text>
<rect class="panel" x="4.0" y="214.0" width="145.6" height="26.0" rx="6"/>
<text x="76.8" y="229.0" text-anchor="middle" class="t-soft">queued by priority</text>
<path class="ln-core" d="M74.0 262.0 L479.3 262.0"/>
<polygon class="head-core" points="479.3,262.0 471.3,257.6 471.3,266.4"/>
<text x="276.7" y="255.0" text-anchor="middle" class="t-soft halo">task from the coordinator, highest priority first</text>
<path class="ln dashed" d="M479.3 296.0 L74.0 296.0"/>
<polygon class="head" points="74.0,296.0 82.0,300.4 82.0,291.6"/>
<text x="276.7" y="289.0" text-anchor="middle" class="t-soft halo">RUNNING_STATE</text>
<path class="ln-core" d="M272.7 330.0 L74.0 330.0"/>
<polygon class="head-core" points="74.0,330.0 82.0,334.4 82.0,325.6"/>
<text x="173.3" y="323.0" text-anchor="middle" class="t-soft halo">more tasks …</text>
<rect class="warn" x="4.0" y="350.0" width="246.4" height="26.0" rx="6"/>
<text x="127.2" y="365.0" text-anchor="middle" class="t-soft">past 1000 × ranks tasks or 10 GB</text>
<path class="ln dashed" d="M74.0 398.0 L686.0 398.0"/>
<polygon class="head" points="686.0,398.0 678.0,393.6 678.0,402.4"/>
<text x="380.0" y="391.0" text-anchor="middle" class="t-soft halo">CENTER_IS_FULL, to every worker</text>
