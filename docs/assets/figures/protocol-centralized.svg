<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 712" role="img" aria-label="Centralized protocol: workers send their spare tasks to the coordinator, which queues them by priority and dispatches them to available workers; past its limits it broadcasts CENTER_IS_FULL and workers run their tasks locally until CENTER_IS_FREE; it never rejects a task, and ends the run once its deficit is zero and its queue empty">
<title>Centralized protocol: workers send their spare tasks to the coordinator, which queues them by priority and dispatches them to available workers; past its limits it broadcasts CENTER_IS_FULL and workers run their tasks locally until CENTER_IS_FREE; it never rejects a task, and ends the run once its deficit is zero and its queue empty</title>
<path class="ln dashed" d="M70.0 66.0 L70.0 704.0"/>
<rect class="mpi" x="11.0" y="20.0" width="118.0" height="46.0" rx="8"/>
<text x="70.0" y="40.0" text-anchor="middle">Coordinator</text>
<text x="70.0" y="56.0" text-anchor="middle" class="t-soft">rank 0</text>
<path class="ln dashed" d="M276.7 66.0 L276.7 704.0"/>
<rect class="core" x="217.7" y="20.0" width="118.0" height="46.0" rx="8"/>
<text x="276.7" y="40.0" text-anchor="middle">Worker 1</text>
<text x="276.7" y="56.0" text-anchor="middle" class="t-soft">rank 1</text>
