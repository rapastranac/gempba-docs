<text x="156.0" y="485.0" text-anchor="middle" class="t-soft">below 80% of the tasks and 90% of memory</text>
<path class="ln dashed" d="M74.0 518.0 L686.0 518.0"/>
<polygon class="head" points="686.0,518.0 678.0,513.6 678.0,522.4"/>
<text x="380.0" y="511.0" text-anchor="middle" class="t-soft halo">CENTER_IS_FREE, to every worker</text>
<path class="ln-core" d="M74.0 552.0 L686.0 552.0"/>
<polygon class="head-core" points="686.0,552.0 678.0,547.6 678.0,556.4"/>
<text x="380.0" y="545.0" text-anchor="middle" class="t-soft halo">task from the coordinator</text>
<rect class="panel" x="18.0" y="572.0" width="724.0" height="26.0" rx="6"/>
<text x="380.0" y="587.0" text-anchor="middle" class="t-soft">Workers acknowledge their parents once passive, as in semi-centralized</text>
<rect class="ok" x="4.0" y="606.0" width="196.0" height="26.0" rx="6"/>
<text x="102.0" y="621.0" text-anchor="middle" class="t-soft">deficit 0 and queue empty</text>
<path class="ln-mpi" d="M74.0 654.0 L686.0 654.0"/>
<polygon class="head-mpi" points="686.0,654.0 678.0,649.6 678.0,658.4"/>
<text x="380.0" y="647.0" text-anchor="middle" class="t-soft halo">TERMINATION, to every worker</text>
</svg>
