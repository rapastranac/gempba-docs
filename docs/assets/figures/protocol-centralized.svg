<text x="690.0" y="40.0" text-anchor="middle">Worker 3</text>
<text x="690.0" y="56.0" text-anchor="middle" class="t-soft">rank 3</text>
<path class="ln-core" d="M74.0 92.0 L272.7 92.0"/>
<polygon class="head-core" points="272.7,92.0 264.7,87.6 264.7,96.4"/>
<text x="173.3" y="85.0" text-anchor="middle" class="t-soft halo">seed task</text>
<path class="ln dashed" d="M272.7 126.0 L74.0 126.0"/>
<polygon class="head" points="74.0,126.0 82.0,130.4 82.0,121.6"/>
<text x="173.3" y="119.0" text-anchor="middle" class="t-soft halo">RUNNING_STATE</text>
<path class="ln-core" d="M272.7 160.0 L74.0 160.0"/>
<polygon class="head-core" points="74.0,160.0 82.0,164.4 82.0,155.6"/>
<text x="173.3" y="153.0" text-anchor="middle" class="t-soft halo">task for the coordinator</text>
