<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-label="v4 against v5: v4 built two flavors and a program picked one at build time; v5 is one core library with multithreading built in, plus an MPI component a program asks for">
<title>v4 against v5: v4 built two flavors and a program picked one at build time; v5 is one core library with multithreading built in, plus an MPI component a program asks for</title>
<rect class="panel" x="10.0" y="10.0" width="370.0" height="380.0" rx="12"/>
<rect class="panel" x="400.0" y="10.0" width="370.0" height="380.0" rx="12"/>
<text x="195.0" y="40.0" text-anchor="middle" class="t-title">v4: two flavors, chosen at build time</text>
<text x="585.0" y="40.0" text-anchor="middle" class="t-title">v5: one core, plus a component</text>
<rect class="box" x="22.0" y="66.0" width="170.0" height="120.0" rx="8"/>
<text x="107.0" y="92.0" text-anchor="middle">libgempba</text>
<text x="107.0" y="111.0" text-anchor="middle" class="t-soft">multithreading</text>
<text x="107.0" y="134.0" text-anchor="middle" class="t-mono t-soft" style="font-size:11px">gempba::multithreading</text>
<text x="107.0" y="153.0" text-anchor="middle" class="t-mono t-soft" style="font-size:11px">COMPONENTS mt</text>
<rect class="box" x="200.0" y="66.0" width="170.0" height="120.0" rx="8"/>
<text x="285.0" y="92.0" text-anchor="middle">libgempba-mpi</text>
<text x="285.0" y="111.0" text-anchor="middle" class="t-soft">one MPI per package</text>
<text x="285.0" y="134.0" text-anchor="middle" class="t-mono t-soft" style="font-size:11px">gempba::multiprocessing</text>
<text x="285.0" y="153.0" text-anchor="middle" class="t-mono t-soft" style="font-size:11px">GEMPBA_MULTIPROCESSING</text>
<rect class="bad dashed" x="30.0" y="236.0" width="330.0" height="52.0" rx="8"/>
<text x="195.0" y="258.0" text-anchor="middle" class="t-bad">A program picks one flavor; mt and mpi</text>
<text x="195.0" y="276.0" text-anchor="middle" class="t-bad">can't be used together</text>
