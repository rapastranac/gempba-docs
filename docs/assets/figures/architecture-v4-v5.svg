<text x="195.0" y="334.0" text-anchor="middle" class="t-soft">Java: io.gempba:gempba, mt / mp-mpi</text>
<text x="195.0" y="352.0" text-anchor="middle" class="t-soft">classifiers, from GitHub Packages with a token</text>
<rect class="box" x="420.0" y="60.0" width="330.0" height="46.0" rx="8"/>
<text x="585.0" y="88.0" text-anchor="middle">Your program, multithreading or MPI</text>
