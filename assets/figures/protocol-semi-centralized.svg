<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 814" role="img" aria-label="Semi-centralized protocol: the coordinator sends Worker 1 its waiting processes and the seed; workers report RUNNING_STATE and AVAILABLE_STATE, send tasks directly to the processes assigned to them, and acknowledge their parents once passive; when the coordinator's deficit reaches zero it sends TERMINATION to every worker">
<title>Semi-centralized protocol: the coordinator sends Worker 1 its waiting processes and the seed; workers report RUNNING_STATE and AVAILABLE_STATE, send tasks directly to the processes assigned to them, and acknowledge their parents once passive; when the coordinator's deficit reaches zero it sends TERMINATION to every worker</title>
<path class="ln dashed" d="M70.0 66.0 L70.0 806.0"/>
<rect class="mpi" x="11.0" y="20.0" width="118.0" height="46.0" rx="8"/>
<text x="70.0" y="40.0" text-anchor="middle">Coordinator</text>
<text x="70.0" y="56.0" text-anchor="middle" class="t-soft">rank 0</text>
<path class="ln dashed" d="M276.7 66.0 L276.7 806.0"/>
<rect class="core" x="217.7" y="20.0" width="118.0" height="46.0" rx="8"/>
<text x="276.7" y="40.0" text-anchor="middle">Worker 1</text>
<text x="276.7" y="56.0" text-anchor="middle" class="t-soft">rank 1</text>
<path class="ln dashed" d="M483.3 66.0 L483.3 806.0"/>
<rect class="core" x="424.3" y="20.0" width="118.0" height="46.0" rx="8"/>
<text x="483.3" y="40.0" text-anchor="middle">Worker 2</text>
<text x="483.3" y="56.0" text-anchor="middle" class="t-soft">rank 2</text>
<path class="ln dashed" d="M690.0 66.0 L690.0 806.0"/>
<rect class="core" x="631.0" y="20.0" width="118.0" height="46.0" rx="8"/>
<text x="690.0" y="40.0" text-anchor="middle">Worker 3</text>
<text x="690.0" y="56.0" text-anchor="middle" class="t-soft">rank 3</text>
<rect class="panel" x="18.0" y="78.0" width="724.0" height="26.0" rx="6"/>
<text x="380.0" y="93.0" text-anchor="middle" class="t-soft">Every rank calls scheduler::run; rank 0 passes the seed</text>
<path class="ln dashed" d="M74.0 126.0 L272.7 126.0"/>
<polygon class="head" points="272.7,126.0 264.7,121.6 264.7,130.4"/>
<text x="173.3" y="119.0" text-anchor="middle" class="t-soft halo">NEXT_PROCESS [W2, W3]: its initial waiting processes</text>
<path class="ln-core" d="M74.0 160.0 L272.7 160.0"/>
<polygon class="head-core" points="272.7,160.0 264.7,155.6 264.7,164.4"/>
<text x="173.3" y="153.0" text-anchor="middle" class="t-soft halo">seed task</text>
<path class="ln dashed" d="M272.7 194.0 L74.0 194.0"/>
<polygon class="head" points="74.0,194.0 82.0,198.4 82.0,189.6"/>
<text x="173.3" y="187.0" text-anchor="middle" class="t-soft halo">RUNNING_STATE</text>
<path class="ln-core" d="M280.7 228.0 L479.3 228.0"/>
<polygon class="head-core" points="479.3,228.0 471.3,223.6 471.3,232.4"/>
<text x="380.0" y="221.0" text-anchor="middle" class="t-soft halo">task (direct)</text>
<path class="ln dashed" d="M479.3 262.0 L74.0 262.0"/>
<polygon class="head" points="74.0,262.0 82.0,266.4 82.0,257.6"/>
<text x="276.7" y="255.0" text-anchor="middle" class="t-soft halo">RUNNING_STATE</text>
<path class="ln-core" d="M280.7 296.0 L686.0 296.0"/>
<polygon class="head-core" points="686.0,296.0 678.0,291.6 678.0,300.4"/>
<text x="483.3" y="289.0" text-anchor="middle" class="t-soft halo">task (direct)</text>
<path class="ln-warn" d="M479.3 330.0 L74.0 330.0"/>
<polygon class="head-warn" points="74.0,330.0 82.0,334.4 82.0,325.6"/>
<text x="276.7" y="323.0" text-anchor="middle" class="t-soft halo">score proposal</text>
<path class="ln-warn" d="M74.0 364.0 L686.0 364.0"/>
<polygon class="head-warn" points="686.0,364.0 678.0,359.6 678.0,368.4"/>
<text x="380.0" y="357.0" text-anchor="middle" class="t-soft halo">best value, to every worker</text>
<rect class="panel" x="596.0" y="384.0" width="160.0" height="26.0" rx="6"/>
<text x="676.0" y="399.0" text-anchor="middle" class="t-soft">W3's subtree is done</text>
<path class="ln-ok dashed" d="M686.0 432.0 L280.7 432.0"/>
<polygon class="head-ok" points="280.7,432.0 288.7,436.4 288.7,427.6"/>
<text x="483.3" y="425.0" text-anchor="middle" class="t-soft halo">TASK_RECEIVED: the deferred acknowledgement</text>
<path class="ln dashed" d="M686.0 466.0 L74.0 466.0"/>
<polygon class="head" points="74.0,466.0 82.0,470.4 82.0,461.6"/>
<text x="380.0" y="459.0" text-anchor="middle" class="t-soft halo">AVAILABLE_STATE</text>
<path class="ln dashed" d="M74.0 500.0 L479.3 500.0"/>
<polygon class="head" points="479.3,500.0 471.3,495.6 471.3,504.4"/>
<text x="276.7" y="493.0" text-anchor="middle" class="t-soft halo">NEXT_PROCESS [W3]: to a running worker with none waiting</text>
<path class="ln-core" d="M487.3 534.0 L686.0 534.0"/>
<polygon class="head-core" points="686.0,534.0 678.0,529.6 678.0,538.4"/>
<text x="586.7" y="527.0" text-anchor="middle" class="t-soft halo">task (direct)</text>
<rect class="panel" x="18.0" y="554.0" width="724.0" height="44.0" rx="6"/>
<text x="380.0" y="569.0" text-anchor="middle" class="t-soft">Each rank acknowledges its parent once it is passive</text>
<text x="380.0" y="587.0" text-anchor="middle" class="t-soft">and every task it sent has been acknowledged</text>
<path class="ln-ok dashed" d="M686.0 620.0 L487.3 620.0"/>
<polygon class="head-ok" points="487.3,620.0 495.3,624.4 495.3,615.6"/>
<text x="586.7" y="613.0" text-anchor="middle" class="t-soft halo">TASK_RECEIVED</text>
<path class="ln-ok dashed" d="M479.3 654.0 L280.7 654.0"/>
<polygon class="head-ok" points="280.7,654.0 288.7,658.4 288.7,649.6"/>
<text x="380.0" y="647.0" text-anchor="middle" class="t-soft halo">TASK_RECEIVED</text>
<path class="ln-ok dashed" d="M272.7 688.0 L74.0 688.0"/>
<polygon class="head-ok" points="74.0,688.0 82.0,692.4 82.0,683.6"/>
<text x="173.3" y="681.0" text-anchor="middle" class="t-soft halo">TASK_RECEIVED</text>
<rect class="ok" x="4.0" y="708.0" width="224.8" height="26.0" rx="6"/>
<text x="116.4" y="723.0" text-anchor="middle" class="t-soft">deficit 0: the search is over</text>
<path class="ln-mpi" d="M74.0 756.0 L686.0 756.0"/>
<polygon class="head-mpi" points="686.0,756.0 678.0,751.6 678.0,760.4"/>
<text x="380.0" y="749.0" text-anchor="middle" class="t-soft halo">TERMINATION: message counts and the run_outcome, to every worker</text>
</svg>
